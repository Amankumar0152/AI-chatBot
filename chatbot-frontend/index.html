<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Varanasi Local Guide - Chat Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="chatbot-root">

    <button id="chatToggleBtn" class="chat-toggle-btn" aria-label="Open chat" aria-expanded="false">
        <svg class="icon icon-chat" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 4H20V16H7L4 19V4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <svg class="icon icon-close" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
    </button>

    <div class="chat-panel" id="chatPanel" role="dialog" aria-label="Varanasi Local Guide chat" aria-hidden="true">

        <header class="chat-header">
            <div class="header-left">
                <div class="avatar">VG</div>
                <div class="header-text">
                    <div class="header-title">
                        Varanasi Local Guide AI
                        <span class="online-dot" title="Online"></span>
                    </div>
                    <div class="header-sub">Usually replies instantly</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="minimizeBtn" aria-label="Minimize chat">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M6 12H18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </button>
                <button class="icon-btn" id="closeBtn" aria-label="Close chat">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </button>
            </div>
        </header>

        <main class="chat-body" id="chatBox">

            <div class="greeting-block" id="greetingBlock">
                <h2 class="greeting" id="greeting">Good Afternoon</h2>
                <p class="greeting-sub">How can I help you explore Varanasi today?</p>

                <div class="suggestion-cards" id="suggestionCards">
                    <button class="suggestion-card" data-type="ask" data-question="How do I book a guided tour?">
                        <span class="card-title">Book a Tour</span>
                        <span class="card-desc">Book a guided tour with a local expert</span>
                    </button>
                    <button class="suggestion-card" data-type="link" data-url="https://varanasilocalguide.com/free-tour">
                        <span class="card-title">Free Ghat Walking Tour</span>
                        <span class="card-desc">Join today's free walking tour</span>
                    </button>
                    <button class="suggestion-card" data-type="ask" data-question="What are the timings and VIP darshan details for Kashi Vishwanath Temple?">
                        <span class="card-title">Kashi Vishwanath Temple</span>
                        <span class="card-desc">Timings, VIP darshan, entry guide</span>
                    </button>
                    <button class="suggestion-card" data-type="ask" data-question="What are the top places to visit in Varanasi?">
                        <span class="card-title">Top Places in Varanasi</span>
                        <span class="card-desc">Must-visit attractions</span>
                    </button>
                    <button class="suggestion-card" data-type="ask" data-question="What is the best street food to try in Varanasi?">
                        <span class="card-title">Best Street Food</span>
                        <span class="card-desc">Popular local food spots</span>
                    </button>
                </div>
            </div>

            <div id="messages"></div>

        </main>

        <form class="chat-input" id="chatForm">
            <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Ask anything about Varanasi..."
                    aria-label="Message"
            ></textarea>
            <button type="submit" id="sendButton" aria-label="Send message">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
                </svg>
            </button>
        </form>

    </div>
</div>

<script src="js/script.js"></script>

</body>
</html>
