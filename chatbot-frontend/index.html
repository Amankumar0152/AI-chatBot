<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

    <header class="app-header">
        <div class="brand">
            <span class="brand-mark">AI</span>
            <span class="brand-name">Chatbot</span>
        </div>
        <button class="new-chat-btn" id="newChatBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            New chat
        </button>
    </header>

    <main class="chat-area" id="chatArea">

        <div class="intro" id="intro">
            <h1 class="intro-greeting" id="greeting">Good Afternoon</h1>
            <p class="intro-sub">How can I help you today?</p>

            <div class="starter-grid" id="starterGrid">
                <button class="starter-card" data-prompt="Explain a complex topic in simple terms">
                    <span class="starter-title">Explain simply</span>
                    <span class="starter-desc">Break down a complex topic</span>
                </button>
                <button class="starter-card" data-prompt="Help me write a professional email">
                    <span class="starter-title">Draft a message</span>
                    <span class="starter-desc">Write something professional</span>
                </button>
                <button class="starter-card" data-prompt="Help me debug an issue in my code">
                    <span class="starter-title">Debug code</span>
                    <span class="starter-desc">Find and fix an issue</span>
                </button>
                <button class="starter-card" data-prompt="Brainstorm ideas for a project">
                    <span class="starter-title">Brainstorm ideas</span>
                    <span class="starter-desc">Explore a new project</span>
                </button>
            </div>
        </div>

        <div class="messages" id="messages"></div>

    </main>

    <footer class="input-bar">
        <form class="input-form" id="chatForm">
            <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Message the assistant..."
                    aria-label="Message"
            ></textarea>
            <button type="submit" id="sendButton" aria-label="Send message">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
                </svg>
            </button>
        </form>
        <p class="disclaimer">AI responses may be inaccurate. Verify important information.</p>
    </footer>

</div>

<script src="js/script.js"></script>

</body>
</html>
